<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Gaming Hub Stream Dashboard - Live countdowns for upcoming game launches. Perfect for OBS browser source.">
  <meta name="theme-color" content="#0B1936">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gaming Hub - Live Launch Countdowns">
  <meta property="og:description" content="Tracking the biggest upcoming game releases with live timers">
  <meta property="og:image" content="https://your-domain.com/og-stream.jpg">

  <title>Gaming Hub • Stream Dashboard</title>

  <!-- Preload -->
  <link rel="preload" href="../shared/styles.css" as="style">
  <link rel="preload" href="../shared/utils.js" as="script">
  <link rel="preload" href="data/stream-events.json" as="fetch" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="stream.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
</head>
<body>
  <!-- Background Canvas for Particles/Effects -->
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <!-- Subtle Grid Overlay -->
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- Main Dashboard -->
  <main class="stream-dashboard" role="main">
    <!-- Top Bar: Brand + Live Indicator -->
    <header class="stream-header">
      <div class="brand-section">
        <div class="logo-mark" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="url(#grad)"/>
            <path d="M12 18h16M12 22h12M12 26h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-name">Gaming Hub</h1>
          <span class="brand-tag">Live Launch Countdowns</span>
        </div>
      </div>

      <div class="live-status" id="liveStatus" aria-live="polite">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-text">Tracking <strong id="liveCount">0</strong> upcoming launches</span>
      </div>

      <div class="time-display" id="timeDisplay" aria-label="Current time">
        <span id="currentTime">--:--:--</span>
        <span id="currentDate">Loading...</span>
      </div>
    </header>

    <!-- Center: Main Countdown Cards -->
    <section class="countdown-grid" id="countdownGrid" aria-label="Game launch countdowns">
      <!-- Cards injected by JS -->
    </section>

    <!-- Bottom: Music Player + Next Event Preview -->
    <footer class="stream-footer">
      <!-- Music Player -->
      <div class="music-player" id="musicPlayer">
        <div class="music-info">
          <div class="music-visualizer" aria-hidden="true">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </div>
          <div class="music-details">
            <span class="music-title" id="musicTitle">Loading...</span>
            <span class="music-artist" id="musicArtist">Non-copyright gaming music</span>
          </div>
        </div>
        <div class="music-controls">
          <button class="music-btn" id="musicPrev" aria-label="Previous track" title="Previous">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5-6l8.5 6-8.5 6V0z"/></svg>
          </button>
          <button class="music-btn music-play" id="musicPlayPause" aria-label="Play/Pause" title="Play/Pause">
            <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="music-btn" id="musicNext" aria-label="Next track" title="Next">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6-8.5-6V18zM15.5 6l8.5 6-8.5 6V6z"/></svg>
          </button>
          <input type="range" class="music-volume" id="musicVolume" min="0" max="1" step="0.1" value="0.3" aria-label="Volume">
        </div>
      </div>

      <!-- Next Event Teaser -->
      <div class="next-event" id="nextEvent" aria-label="Next upcoming launch">
        <span class="next-label">Next Launch</span>
        <span class="next-game" id="nextGameName">Loading...</span>
        <span class="next-countdown" id="nextCountdown">--d --h --m</span>
      </div>

      <!-- Channel Branding -->
      <div class="channel-brand">
        <a href="https://youtube.com/@yourchannel" target="_blank" rel="noopener" class="channel-link">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span>@yourchannel</span>
          <span class="channel-live" aria-hidden="true">LIVE</span>
        </a>
      </div>
    </footer>
  </main>

  <!-- Audio Element -->
  <audio id="bgMusic" crossorigin="anonymous" preload="metadata"></audio>

  <!-- Scripts -->
  <script type="module" src="stream.js"></script>
</body>
</html>
